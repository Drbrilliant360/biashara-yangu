version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/mobile-android"
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: "/mobile-ios"
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
